services:
  - type: web
    name: sababar-bnpl-staging
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run db:generate && npm run build:api && npm run build:web
    startCommand: npm run db:migrate:deploy && npm run start:prod
    healthCheckPath: /api/auth/setup-status
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: driver-documents
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: BOOTSTRAP_TOKEN
        generateValue: true
      - key: SESSION_TTL_HOURS
        value: "12"
      - key: MAX_DOCUMENT_BYTES
        value: "20971520"
      - key: MAX_VIDEO_BYTES
        value: "157286400"
